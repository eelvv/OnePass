[package]
name = "onepass-cli"
version = "0.1.3"
edition.workspace = true
description = "OnePass interactive terminal UI: browse, edit, and generate 2FA codes"

[lib]
name = "onepass_cli"
path = "src/lib.rs"

[[bin]]
name = "onepass-cli"
path = "src/main.rs"

[dependencies]
onepass-engine = { path = "../engine" }
ratatui = "0.29"
crossterm = "0.28"
rpassword = "7"
unicode-width = "0.2"
arboard = "3"
