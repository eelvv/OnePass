[package]
name = "onepass-engine"
version = "0.1.1"
edition = "2021"
description = "OnePass core library: KeePass KDBX 4, OTP, otpauth URI, and 2FA import/export"
license = "MIT OR Apache-2.0"

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
percent-encoding = "2"
aes = "0.8"
cipher = "0.4"
argon2 = "0.5"
cbc = "0.1"
twofish = "0.7"
chacha20 = "0.9"
salsa20 = "0.10"
flate2 = "1"
base64 = "0.22"
quick-xml = "0.37"
getrandom = "0.2"
serde_json = "1"
