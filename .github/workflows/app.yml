# OnePass Android app: Flutter UI + Rust engine, built via cargokit.
#
# Build machine requirements (GitHub ubuntu-latest runners have all of this):
#   JDK 17, Flutter stable, Rust with aarch64-linux-android target, Android SDK/NDK.
#
# Runs on branch pushes (APK artifact for manual device testing), as a
# reusable workflow called by release.yml (app-v* / v* tags), and manually.
# Tag releases go through release.yml only — the same shape as cli.yml —
# so a tag never triggers two racing builds.

name: App build

on:
  push:
    branches: [main, flutter-app]
  workflow_call:
    inputs:
      upload:
        description: "Attach APK to the Release of `tag`"
        type: boolean
        default: true
      tag:
        description: "Tag whose Release receives the APK (required when upload = true)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      upload:
        description: "Attach APK to the Release of `tag`"
        type: boolean
        default: false
      tag:
        description: "Tag whose Release receives the APK (required when upload = true)"
        type: string
        default: ""

# Required for softprops/action-gh-release to attach APKs to releases
# (same grant cli.yml declares for its release uploads).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # cargokit compiles app/rust inside Gradle; without this cache the
      # engine + bridge rebuild from scratch on every run. The shared-key is
      # separate from the root workspace (ci.yml / cli.yml): the Cargo.lock is
      # identical, so the same key would collide across different target
      # layouts.
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: onepass
          shared-key: rust-app
          add-job-id-key: false
          cache-on-failure: true
          workspaces: app/rust

      # Bridge bindings (rust/src/frb_generated.rs, lib/src/rust/*) are COMMITTED
      # so the build never needs the codegen tool. This step only guards against
      # drift: regenerate and fail if the committed bindings are stale.
      - name: Verify generated bridge code is up to date
        working-directory: app
        run: |
          mkdir -p /tmp/frb
          curl -sL https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.13.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-musl-v2.13.0.tgz | tar xz -C /tmp/frb
          /tmp/frb/flutter_rust_bridge_codegen generate
          git diff --exit-code -- rust/src lib/src

      # The Rust core (app/rust) is compiled by cargokit during this Gradle run
      # and linked into the APK as librust_lib_onepass.so.
      # arm64-only: matches the installed Rust target (first release scope).
      - name: Build release APK (debug-signed, installable)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: onepass-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: inputs.upload == true && inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
