name: Release

# Tag router for the hybrid release scheme:
#
#   cli-v0.1.3      -> build & release the CLI only
#   app-v0.1.0      -> build & release the app only (future)
#   desktop-v0.1.0  -> build & release desktop only (future)
#   v0.2.0          -> global bundle: build every component into one release
#
# engine is a library and is never tagged — its version rides along in the
# binaries and is noted in release notes.

on:
  push:
    tags:
      - 'v*'
      - 'cli-v*'
      - 'app-v*'
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
    steps:
      - name: Parse tag
        id: parse
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            cli-v*)     echo "component=cli"     >> "$GITHUB_OUTPUT" ;;
            app-v*)     echo "component=app"     >> "$GITHUB_OUTPUT" ;;
            desktop-v*) echo "component=desktop" >> "$GITHUB_OUTPUT" ;;
            v*)         echo "component=all"     >> "$GITHUB_OUTPUT" ;;
            *)          echo "component=none"    >> "$GITHUB_OUTPUT" ;;
          esac

  build-cli:
    needs: plan
    if: needs.plan.outputs.component == 'all' || needs.plan.outputs.component == 'cli'
    uses: ./.github/workflows/cli.yml
    with:
      upload: true
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
    secrets: inherit

  # Future components follow the same shape:
  #
  # build-app:
  #   needs: plan
  #   if: needs.plan.outputs.component == 'all' || needs.plan.outputs.component == 'app'
  #   uses: ./.github/workflows/app.yml
  #   permissions:
  #     contents: write
  #   secrets: inherit
