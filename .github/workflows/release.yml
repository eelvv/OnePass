name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: onepass-cli-linux-x86_64.tar.gz
            strip: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: onepass-cli-macos-aarch64.tar.gz
            strip: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: onepass-cli-windows-x86_64.zip
            strip: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin onepass-cli --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          BINARY=target/${{ matrix.target }}/release/onepass-cli
          [ "${{ runner.os }}" = "Windows" ] && BINARY="$BINARY.exe"

          NAME="${{ matrix.artifact%.tar.gz}"
          NAME="${NAME%.zip}"

          STAGING=staging/$NAME
          mkdir -p "$STAGING"
          cp "$BINARY" "$STAGING/onepass-cli"
          chmod +x "$STAGING/onepass-cli"

          if [[ ${{ matrix.strip }} == "true" ]]; then
            if command -v strip &>/dev/null; then
              strip "$STAGING/onepass-cli" || true
            fi
          fi

          case ${{ matrix.artifact }} in
            *.tar.gz)
              tar -czf "${{ matrix.artifact }}" -C staging "$NAME"
              ;;
            *.zip)
              pushd staging > /dev/null
              zip -r -X "../${{ matrix.artifact }}" "$NAME"
              popd > /dev/null
              ;;
          esac
          rm -rf staging

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
